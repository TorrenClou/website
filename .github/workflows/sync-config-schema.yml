name: Sync config schema

# Pulls the configuration schema from the latest backend release and commits it
# directly to main when it has changed.
#
# The schema is committed here rather than fetched at build time, deliberately.
# A build-time fetch makes every production deploy depend on GitHub being
# reachable, and the failure lands at the worst possible moment with no good
# fallback — serving stale data silently is worse than not fetching at all.
#
# It tracks the latest *release*, not main: a documentation site describes
# released software, so if this sync never runs the site keeps describing the
# last release, which is correct rather than merely stale.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [config-schema]

permissions:
  contents: write

concurrency:
  group: sync-config-schema
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download the schema from the latest backend release
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag=$(gh release view --repo TorrentDrive/backend --json tagName --jq .tagName 2>/dev/null || echo "")
          if [ -z "$tag" ]; then
            echo "::warning::No release found in TorrentDrive/backend. Nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest backend release: ${tag}"

          if ! gh release download "$tag" --repo TorrentDrive/backend \
                 --pattern config-schema.json --output /tmp/config-schema.json --clobber; then
            echo "::warning::Release ${tag} has no config-schema.json asset. Nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to commit something that is not the schema we expect, rather
          # than replacing a working reference with a 404 page.
          if ! jq -e '.entries | length > 0' /tmp/config-schema.json > /dev/null; then
            echo "::error::Downloaded file has no entries; not committing it."
            exit 1
          fi

          mkdir -p content/generated
          if [ -f content/generated/config-schema.json ] && cmp -s /tmp/config-schema.json content/generated/config-schema.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            cp /tmp/config-schema.json content/generated/config-schema.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "entries=$(jq '.entries | length' content/generated/config-schema.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated schema to main
        if: steps.fetch.outputs.changed == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.fetch.outputs.tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add content/generated/config-schema.json
          if ! git diff --cached --quiet; then
            git commit -m "docs(schema): sync configuration schema for backend ${tag} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
