name: Sync config schema

# Pulls the configuration schema from the latest backend release and opens a PR
# when it has changed.
#
# The schema is committed here rather than fetched at build time, deliberately.
# A build-time fetch makes every production deploy depend on GitHub being
# reachable, and the failure lands at the worst possible moment with no good
# fallback — serving stale data silently is worse than not fetching at all.
#
# Committing it also means a human sees the diff. When a PR shows
# `JWT_SECRET: required false -> true`, that is a review moment rather than a
# value that quietly changed underneath the documentation.
#
# It tracks the latest *release*, not main: a documentation site describes
# released software, so if this sync never runs the site keeps describing the
# last release, which is correct rather than merely stale.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [config-schema]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-config-schema
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download the schema from the latest backend release
        id: fetch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          tag=$(gh release view --repo TorrenClou/backend --json tagName --jq .tagName)
          echo "Latest backend release: ${tag}"

          if ! gh release download "$tag" --repo TorrenClou/backend \
                 --pattern config-schema.json --output /tmp/config-schema.json --clobber; then
            echo "::warning::Release ${tag} has no config-schema.json asset. Nothing to sync."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Refuse to commit something that is not the schema we expect, rather
          # than replacing a working reference with a 404 page.
          if ! jq -e '.entries | length > 0' /tmp/config-schema.json > /dev/null; then
            echo "::error::Downloaded file has no entries; not committing it."
            exit 1
          fi

          mkdir -p content/generated
          if cmp -s /tmp/config-schema.json content/generated/config-schema.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date."
          else
            cp /tmp/config-schema.json content/generated/config-schema.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "entries=$(jq '.entries | length' content/generated/config-schema.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: Open or update the sync PR
        if: steps.fetch.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.fetch.outputs.tag }}"
          branch="chore/config-schema"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add content/generated/config-schema.json
          git commit -m "docs: sync configuration schema for backend ${tag}"
          git push --force-with-lease origin "$branch"

          title="docs: sync configuration schema for backend ${tag}"
          body="Configuration reference regenerated from backend \`${tag}\`, now describing ${{ steps.fetch.outputs.entries }} values.

          Read the diff rather than merging on sight. A value becoming required, changing its default, or disappearing is a behaviour change in the product, and this file is the only place it shows up as a reviewable line."

          existing=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body "$body"
          else
            gh pr create --base main --head "$branch" --title "$title" --body "$body"
          fi
