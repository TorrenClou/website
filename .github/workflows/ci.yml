name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Type check, build, and release
    if: >-
      github.event_name != 'push' ||
      (
        !startsWith(github.event.head_commit.message, 'chore(release):') &&
        !startsWith(github.event.head_commit.message, 'docs(schema):')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      # The docs sidebar is driven by meta.json, which lists page slugs by hand.
      # A typo there silently drops the page from the nav without failing the
      # build, so check every listed slug resolves to a file and every file is
      # listed.
      - name: Check meta.json matches content/docs
        run: |
          set -euo pipefail
          fail=0
          for dir in $(find content/docs -name meta.json -exec dirname {} \;); do
            listed=$(node -e "
              const m = require('./$dir/meta.json');
              console.log((m.pages || [])
                .filter(p => !p.startsWith('---'))
                .join('\n'));
            ")
            for slug in $listed; do
              if [ ! -e "$dir/$slug.mdx" ] && [ ! -d "$dir/$slug" ]; then
                echo "::error file=$dir/meta.json::'$slug' is listed but $dir/$slug.mdx does not exist"
                fail=1
              fi
            done
            for f in "$dir"/*.mdx; do
              [ -e "$f" ] || continue
              slug=$(basename "$f" .mdx)
              if ! echo "$listed" | grep -qx "$slug"; then
                echo "::error file=$f::'$slug' exists but is not listed in $dir/meta.json, so it is missing from the sidebar"
                fail=1
              fi
            done
          done
          exit $fail

      # snippets/ holds the handful of strings that must appear verbatim in more
      # than one place. They are checked rather than injected, so this fails if
      # the docs and the canonical file have drifted apart.
      - name: Check docs match snippets/
        run: |
          set -euo pipefail
          fail=0
          for f in snippets/install-linux.txt snippets/install-windows.txt; do
            value=$(cat "$f")
            if ! grep -rqF "$value" content/docs/; then
              echo "::error file=$f::not found verbatim anywhere in content/docs/"
              echo "  expected: $value"
              fail=1
            fi
          done
          [ "$fail" -eq 0 ] && echo "Snippets match."
          exit $fail

      # Relative links break wherever a Markdown file is rendered outside its
      # own directory. This repo's README is read on GitHub and scraped
      # elsewhere; the org profile shipped 404s for exactly this reason.
      - name: Ban relative links in Markdown
        run: |
          set -euo pipefail
          if grep -rnE '\]\((\./|\.\./|docs/|wiki/)' --include='*.md' . \
               --exclude-dir=node_modules --exclude-dir=.next --exclude-dir=.wiki-import; then
            echo "::error::Relative Markdown links found. Use absolute https:// URLs."
            exit 1
          fi
          echo "No relative links."

      - name: Auto-release on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          pkg_ver=$(node -p "require('./package.json').version")
          latest_tag=$(git describe --tags --abbrev=0 --match "v[0-9]*" 2>/dev/null || echo "")

          if [ -z "$latest_tag" ] || ! git rev-parse -q --verify "refs/tags/v${pkg_ver}" >/dev/null 2>&1; then
            next_ver="$pkg_ver"
            range="${latest_tag:+${latest_tag}..}HEAD"
          else
            commits_since=$(git log "${latest_tag}..HEAD" --pretty=format:"%s" 2>/dev/null || echo "")
            if [ -z "$commits_since" ]; then
              echo "No new commits since ${latest_tag}; skipping release."
              exit 0
            fi
            tag_ver="${latest_tag#v}"
            IFS='.' read -r major minor patch <<< "$tag_ver"
            if echo "$commits_since" | grep -qE '^[a-z]+(\([^)]+\))?!:|BREAKING CHANGE'; then
              major=$((major + 1)); minor=0; patch=0
            elif echo "$commits_since" | grep -qE '^feat(\([^)]+\))?:'; then
              minor=$((minor + 1)); patch=0
            else
              patch=$((patch + 1))
            fi
            next_ver="${major}.${minor}.${patch}"
            range="${latest_tag}..HEAD"
            npm version "$next_ver" --no-git-tag-version
          fi

          date_str=$(date -u +%Y-%m-%d)
          changes=$(git log $range --pretty=format:"* %s (%h)" --no-merges | grep -v "^* chore(release):" || true)
          [ -z "$changes" ] && changes="* Maintenance and documentation updates"

          if [ -f CHANGELOG.md ] && ! grep -q "## \[${next_ver}\]" CHANGELOG.md; then
            {
              echo "# Changelog"
              echo ""
              echo "## [${next_ver}](https://github.com/TorrentDrive/website/releases/tag/v${next_ver}) (${date_str})"
              echo ""
              echo "$changes"
              echo ""
              tail -n +2 CHANGELOG.md
            } > CHANGELOG.md.tmp
            mv CHANGELOG.md.tmp CHANGELOG.md
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add package.json package-lock.json CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): v${next_ver} [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

          if ! git rev-parse -q --verify "refs/tags/v${next_ver}" >/dev/null 2>&1; then
            git tag -a "v${next_ver}" -m "Release v${next_ver}"
            git push origin "v${next_ver}"
          fi

          if ! gh release view "v${next_ver}" >/dev/null 2>&1; then
            gh release create "v${next_ver}" \
              --title "v${next_ver}" \
              --notes "$changes"
          fi
